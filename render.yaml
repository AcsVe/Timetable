services:
  - type: web
    name: timetable
    runtime: python
    region: frankfurt   # closest Render region to Jordan; create the Neon project in Frankfurt (eu-central-1) too
    plan: free
    buildCommand: pip install -r requirements.txt
    # Migrations + base data run at start (idempotent). Works on the free plan, which has no pre-deploy step.
    startCommand: flask --app wsgi.py db upgrade && flask --app wsgi.py seed-base && gunicorn wsgi:app --workers 2 --threads 4 --timeout 60
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_URL
        sync: false   # Neon connection string
      - key: SECRET_KEY
        generateValue: true
      - key: SESSION_COOKIE_SECURE
        value: "1"
      - key: INITIAL_ADMIN_EMAIL
        sync: false   # first admin (created once, only if no admin exists)
      - key: INITIAL_ADMIN_PASSWORD
        sync: false   # remove after the first login
      - key: APP_TIMEZONE
        value: Asia/Amman
      - key: SEED_DEMO
        value: "0"    # "1" = create a demo school once, only into an empty database
      - key: MS_TENANT_ID
        sync: false   # optional: e-mail through Microsoft 365 (can also be set on the «البريد» page)
      - key: MS_CLIENT_ID
        sync: false
      - key: MS_CLIENT_SECRET
        sync: false
      - key: MS_MAIL_SENDER
        sync: false   # e.g. timetable@school.edu.jo
