{% extends "base.html" %}
{% block title %}تسجيل الدخول — جدولة الحصص{% endblock %}
{% block body %}
<div class="wrap">
  <form class="card" method="post">
    <h1>تسجيل الدخول</h1>
    <label for="email">البريد الإلكتروني</label>
    <input id="email" name="email" type="email" value="{{ email or '' }}" autocomplete="username" required>
    <label for="password">كلمة المرور</label>
    <input id="password" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">الدخول</button>
    {% if error %}<p class="err">البريد الإلكتروني أو كلمة المرور غير صحيحة، أو أن الحساب غير مفعّل.</p>{% endif %}
  </form>
</div>
{% endblock %}
