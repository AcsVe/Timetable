<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}جدولة الحصص{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root { --bg:#f6f7f9; --card:#fff; --ink:#1d2330; --muted:#667085; --accent:#1f6feb; --err:#b42318; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:'Tajawal',system-ui,sans-serif; background:var(--bg); color:var(--ink); }
    .wrap { max-width: 420px; margin: 10vh auto; padding: 0 16px; }
    .card { background:var(--card); border-radius:12px; padding:28px; box-shadow:0 1px 3px rgba(0,0,0,.08); }
    h1 { font-size:1.4rem; margin:0 0 18px; }
    label { display:block; margin:12px 0 6px; color:var(--muted); font-size:.95rem; }
    input { width:100%; padding:10px 12px; border:1px solid #d0d5dd; border-radius:8px; font:inherit; }
    button { margin-top:18px; width:100%; padding:11px; border:0; border-radius:8px; background:var(--accent);
             color:#fff; font:inherit; font-weight:700; cursor:pointer; }
    .err { color:var(--err); margin-top:12px; }
  </style>
</head>
<body>{% block body %}{% endblock %}</body>
</html>
